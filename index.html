<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Achados da Shopee</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #fff4ec, #ffffff);
      color: #222;
    }
    .card {
      width: min(92%, 420px);
      text-align: center;
      padding: 32px 22px;
      border-radius: 24px;
      background: white;
      box-shadow: 0 10px 35px rgba(0,0,0,.12);
    }
    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #ff5a00;
      color: white;
      font-size: 42px;
      font-weight: 800;
    }
    h1 { margin: 0 0 8px; font-size: 28px; }
    p { margin: 0 0 24px; color: #666; line-height: 1.45; }
    a {
      display: block;
      text-decoration: none;
      background: #25D366;
      color: white;
      font-weight: 800;
      padding: 17px 18px;
      border-radius: 14px;
      font-size: 18px;
    }
    .small { margin-top: 18px; font-size: 13px; color: #999; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">🛍️</div>
    <h1>Achados da Shopee</h1>
    <p>🔥 Ofertas, promoções e achadinhos todos os dias!</p>
    <a href="https://chat.whatsapp.com/E8lpKH0n0VW1hRUBa631oC" target="_blank" rel="noopener">
      🟢 ENTRAR NO GRUPO DO WHATSAPP
    </a>
    <div class="small">Clique no botão para entrar no grupo.</div>
  </main>
</body>
</html>
